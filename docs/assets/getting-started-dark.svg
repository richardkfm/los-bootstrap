<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-label="Getting started in four steps: install on your computer, turn on USB debugging, plug in and tap Allow, run los-bootstrap">
  <title>Getting started with los-bootstrap</title>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><g transform="translate(0,0)"><rect x="0.5" y="0.5" width="223" height="299" rx="12" fill="#161b22" stroke="#30363d"/><g transform="translate(0,22)"><rect x="52" y="24" width="120" height="76" rx="6" fill="#e6edf3"/><rect x="57" y="29" width="110" height="64" rx="2" fill="#010409"/><path d="M38,104H186L178,112H46Z" fill="#e6edf3"/><text x="62" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9" fill="#4DB6AC">$ <tspan fill="#c9d1d9">curl … | sh</tspan></text><text x="62" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="8" fill="#3fb950">✓ adb</text><text x="62" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="8" fill="#3fb950">✓ los-bootstrap</text></g><circle cx="112.0" cy="174" r="12" fill="#4DB6AC"/><text x="112.0" y="178.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><text x="112.0" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Install on your computer</text><text x="112.0" y="236" text-anchor="middle" font-size="13" fill="#9198a1">One command installs</text><text x="112.0" y="254" text-anchor="middle" font-size="13" fill="#9198a1">los-bootstrap and adb.</text><text x="112.0" y="272" text-anchor="middle" font-size="13" fill="#9198a1">Linux, macOS or Windows.</text></g><path d="M228,150h18m-6,-6l6,6l-6,6" fill="none" stroke="#6e7681" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(252,0)"><rect x="0.5" y="0.5" width="223" height="299" rx="12" fill="#161b22" stroke="#30363d"/><g transform="translate(0,22)"><rect x="80" y="12" width="62" height="112" rx="9" fill="#e6edf3"/><rect x="84" y="20" width="54" height="96" rx="3" fill="#161b22"/><rect x="104" y="15" width="14" height="2.5" rx="1.2" fill="#6e7681"/><text x="88" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="7" fill="#9198a1">About phone</text><rect x="87" y="40" width="48" height="16" rx="2" fill="#4DB6AC" opacity="0.18"/><text x="90" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="7" font-weight="700" fill="#e6edf3">Build number</text><text x="111" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#4DB6AC" text-anchor="middle">×7</text><text x="88" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="6.5" fill="#e6edf3">USB debugging</text><rect x="88" y="92" width="18" height="8" rx="4" fill="#4DB6AC"/><circle cx="102" cy="96" r="3" fill="#fff"/></g><circle cx="112.0" cy="174" r="12" fill="#4DB6AC"/><text x="112.0" y="178.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text x="112.0" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Turn on USB debugging</text><text x="112.0" y="236" text-anchor="middle" font-size="13" fill="#9198a1">Tap Build number 7× to</text><text x="112.0" y="254" text-anchor="middle" font-size="13" fill="#9198a1">unlock Developer options,</text><text x="112.0" y="272" text-anchor="middle" font-size="13" fill="#9198a1">then switch on USB debugging.</text></g><path d="M480,150h18m-6,-6l6,6l-6,6" fill="none" stroke="#6e7681" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(504,0)"><rect x="0.5" y="0.5" width="223" height="299" rx="12" fill="#161b22" stroke="#30363d"/><g transform="translate(0,22)"><path d="M58,118 C58,134 108,132 112,104" fill="none" stroke="#6e7681" stroke-width="3" stroke-linecap="round"/><rect x="10" y="66" width="56" height="44" rx="4" fill="#e6edf3"/><rect x="14" y="70" width="48" height="34" rx="1.5" fill="#010409"/><rect x="54" y="112" width="8" height="8" rx="1" fill="#6e7681"/><rect x="112" y="4" width="62" height="112" rx="9" fill="#e6edf3"/><rect x="116" y="12" width="54" height="96" rx="3" fill="#161b22"/><rect x="136" y="7" width="14" height="2.5" rx="1.2" fill="#6e7681"/><rect x="118" y="34" width="50" height="46" rx="4" fill="#30363d"/><text x="121" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="6" font-weight="700" fill="#e6edf3">Allow USB</text><text x="121" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="6" font-weight="700" fill="#e6edf3">debugging?</text><rect x="138" y="64" width="26" height="11" rx="5.5" fill="#4DB6AC"/><text x="151" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="6" font-weight="700" fill="#fff" text-anchor="middle">Allow</text></g><circle cx="112.0" cy="174" r="12" fill="#4DB6AC"/><text x="112.0" y="178.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text x="112.0" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Plug in and tap Allow</text><text x="112.0" y="236" text-anchor="middle" font-size="13" fill="#9198a1">Connect a USB cable. The</text><text x="112.0" y="254" text-anchor="middle" font-size="13" fill="#9198a1">phone asks to trust this</text><text x="112.0" y="272" text-anchor="middle" font-size="13" fill="#9198a1">computer — tap Allow.</text></g><path d="M732,150h18m-6,-6l6,6l-6,6" fill="none" stroke="#6e7681" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(756,0)"><rect x="0.5" y="0.5" width="223" height="299" rx="12" fill="#161b22" stroke="#30363d"/><g transform="translate(0,22)"><rect x="52" y="24" width="120" height="76" rx="6" fill="#e6edf3"/><rect x="57" y="29" width="110" height="64" rx="2" fill="#010409"/><path d="M38,104H186L178,112H46Z" fill="#e6edf3"/><text x="62" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9" fill="#4DB6AC">$ <tspan fill="#c9d1d9">los-bootstrap</tspan></text><text x="62" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="7.5" fill="#39c5cf">› Audit</text><text x="62" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="7.5" fill="#8b949e">  Harden</text><text x="62" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="7.5" fill="#8b949e">  Bootstrap …</text></g><circle cx="112.0" cy="174" r="12" fill="#4DB6AC"/><text x="112.0" y="178.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text><text x="112.0" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Run los-bootstrap</text><text x="112.0" y="236" text-anchor="middle" font-size="13" fill="#9198a1">The wizard finds your</text><text x="112.0" y="254" text-anchor="middle" font-size="13" fill="#9198a1">phone and walks you</text><text x="112.0" y="272" text-anchor="middle" font-size="13" fill="#9198a1">through every step.</text></g></g>
</svg>
