  <text x="430.0" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">los-bootstrap — USB: Pixel 7 (LineageOS 21)</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#c9d1d9">
    <g class="s1"><text x="20" y="52" fill="#4DB6AC" font-weight="700">$</text><text x="36.260000000000005" y="52" textLength="170.7" lengthAdjust="spacing">los-bootstrap devices</text><g class="s1c0"><rect x="36.260000000000005" y="38" width="180.9" height="19" fill="#0d1117"/><g class="s1c0k"><rect class="blink" x="36.260000000000005" y="39" width="8.1" height="16" fill="#c9d1d9"/></g></g><text class="s1c0l0" x="20" y="71" xml:space="preserve">  38141FDJH004QN           device</text><text x="20" y="109" fill="#4DB6AC" font-weight="700">$</text><text x="36.260000000000005" y="109" textLength="154.5" lengthAdjust="spacing">los-bootstrap audit</text><g class="s1c1"><rect x="36.260000000000005" y="95" width="164.6" height="19" fill="#0d1117"/><g class="s1c1k"><rect class="blink" x="36.260000000000005" y="96" width="8.1" height="16" fill="#c9d1d9"/></g></g><text class="s1c1l0" x="20" y="128" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="700">Device</tspan></text><text class="s1c1l1" x="20" y="147" xml:space="preserve">  Model           : Pixel 7 (panther)</text><text class="s1c1l2" x="20" y="166" xml:space="preserve">  Security patch  : 2025-09-05</text><text class="s1c1l3" x="20" y="185" xml:space="preserve">  ROM             : LineageOS 21.0-20250915-NIGHTLY-panther</text><text class="s1c1l5" x="20" y="223" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="700">Audit findings</tspan></text><text class="s1c1l6" x="20" y="242" xml:space="preserve">  <tspan fill="#d29922">!</tspan>  Private DNS is off</text><text class="s1c1l7" x="20" y="261" xml:space="preserve">     DNS lookups go to whatever the network hands you, in cleartext.</text><text class="s1c1l8" x="20" y="280" xml:space="preserve">     <tspan fill="#39c5cf">→ How to fix:</tspan> Settings &gt; Network &gt; Private DNS &gt; dns.quad9.net</text><text class="s1c1l9" x="20" y="299" xml:space="preserve">  <tspan fill="#3fb950">✓</tspan>  No common Google client packages installed</text><text class="s1c1l10" x="20" y="318" xml:space="preserve">  <tspan fill="#3fb950">✓</tspan>  ADB-over-network is not enabled</text><text class="s1c1l11" x="20" y="337" xml:space="preserve">  <tspan fill="#3fb950">✓</tspan>  Screen lock appears enabled</text><text class="s1c1l12" x="20" y="356" xml:space="preserve">  <tspan fill="#8b949e">·  microG installed (free-software GMS replacement)</tspan></text></g><g class="s2"><text x="20" y="52" fill="#4DB6AC" font-weight="700">$</text><text x="36.260000000000005" y="52" textLength="162.6" lengthAdjust="spacing">los-bootstrap harden</text><g class="s2c0"><rect x="36.260000000000005" y="38" width="172.7" height="19" fill="#0d1117"/><g class="s2c0k"><rect class="blink" x="36.260000000000005" y="39" width="8.1" height="16" fill="#c9d1d9"/></g></g><text class="s2c0l0" x="20" y="71" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="700">Hardening checks</tspan></text><text class="s2c0l1" x="20" y="90" xml:space="preserve">  <tspan fill="#d29922">!</tspan>  Developer options enabled</text><text class="s2c0l2" x="20" y="109" xml:space="preserve">  <tspan fill="#d29922">!</tspan>  USB debugging (ADB) enabled</text><text class="s2c0l3" x="20" y="128" xml:space="preserve">  <tspan fill="#d29922">!</tspan>  Verified boot: orange (bootloader unlocked)</text><text class="s2c0l4" x="20" y="147" xml:space="preserve">  <tspan fill="#d29922">!</tspan>  Lockdown in power menu not enabled</text><text class="s2c0l5" x="20" y="166" xml:space="preserve">     The Lockdown option instantly disables fingerprint and face</text><text class="s2c0l6" x="20" y="185" xml:space="preserve">     unlock — useful at a border crossing or after theft.</text><text class="s2c0l7" x="20" y="204" xml:space="preserve">     <tspan fill="#39c5cf">→ Fix:</tspan> adb shell settings put secure lockdown_in_power_menu 1</text><text class="s2c0l8" x="20" y="223" xml:space="preserve">     <tspan fill="#d29922">⚠  Tradeoff:</tspan> None. Lockdown does not wipe the device.</text><text class="s2c0l9" x="20" y="242" xml:space="preserve">  <tspan fill="#3fb950">✓</tspan>  Screen lock appears enabled</text><text class="s2c0l10" x="20" y="261" xml:space="preserve">  <tspan fill="#3fb950">✓</tspan>  Storage is encrypted</text><text class="s2c0l11" x="20" y="280" xml:space="preserve">  <tspan fill="#3fb950">✓</tspan>  Unknown sources (global) not enabled</text><text class="s2c0l12" x="20" y="299" xml:space="preserve">  4 issues need attention.</text></g><g class="s3"><text x="20" y="52" fill="#4DB6AC" font-weight="700">$</text><text x="36.260000000000005" y="52" textLength="357.7" lengthAdjust="spacing">los-bootstrap plan --profile privacy-default</text><g class="s3c0"><rect x="36.260000000000005" y="38" width="367.9" height="19" fill="#0d1117"/><g class="s3c0k"><rect class="blink" x="36.260000000000005" y="39" width="8.1" height="16" fill="#c9d1d9"/></g></g><text class="s3c0l0" x="20" y="71" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="700">Profile: privacy-default</tspan></text><text class="s3c0l1" x="20" y="90" xml:space="preserve">  Sideloads F-Droid, queues replacement apps, switches on encrypted DNS.</text><text class="s3c0l3" x="20" y="128" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="700">Steps</tspan></text><text class="s3c0l4" x="20" y="147" xml:space="preserve">   1 <tspan fill="#8b949e">[=] skip</tspan>           org.fdroid.fdroid already installed</text><text class="s3c0l5" x="20" y="166" xml:space="preserve">   2 <tspan fill="#39c5cf">[↓] install_apk</tspan>    com.aurora.store from F-Droid</text><text class="s3c0l6" x="20" y="185" xml:space="preserve">   3 <tspan fill="#39c5cf">[↓] install_apk</tspan>    net.osmand.plus from F-Droid</text><text class="s3c0l7" x="20" y="204" xml:space="preserve">   4 <tspan fill="#39c5cf">[↓] install_apk</tspan>    org.thunderdog.challegram from F-Droid</text><text class="s3c0l8" x="20" y="223" xml:space="preserve">   5 <tspan fill="#d29922">[~] set_setting</tspan>    global.private_dns_mode = 'hostname'</text><text class="s3c0l10" x="20" y="261" xml:space="preserve">Summary: 6 to run, 0 manual, 2 already satisfied.</text></g><g class="s4"><text x="20" y="52" fill="#4DB6AC" font-weight="700">$</text><text x="36.260000000000005" y="52" textLength="203.3" lengthAdjust="spacing">los-bootstrap flash check</text><g class="s4c0"><rect x="36.260000000000005" y="38" width="213.4" height="19" fill="#0d1117"/><g class="s4c0k"><rect class="blink" x="36.260000000000005" y="39" width="8.1" height="16" fill="#c9d1d9"/></g></g><text class="s4c0l0" x="20" y="71" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="700">First-Boot Verification</tspan></text><text class="s4c0l1" x="20" y="90" xml:space="preserve">  <tspan fill="#3fb950">✓</tspan>  LineageOS detected</text><text class="s4c0l2" x="20" y="109" xml:space="preserve">  <tspan fill="#3fb950">✓</tspan>  Verified Boot state acceptable</text><text class="s4c0l3" x="20" y="128" xml:space="preserve">  <tspan fill="#3fb950">✓</tspan>  microG is installed (not real Play Services)</text><text class="s4c0l4" x="20" y="147" xml:space="preserve">  <tspan fill="#8b949e">·  A/B slot active: _a</tspan></text><text class="s4c0l6" x="20" y="185" xml:space="preserve">  <tspan fill="#3fb950">Clean first boot — the install looks good.</tspan></text><text x="20" y="223" fill="#4DB6AC" font-weight="700">$</text><text x="36.260000000000005" y="223" textLength="243.9" lengthAdjust="spacing">los-bootstrap integrity doctor</text><g class="s4c1"><rect x="36.260000000000005" y="209" width="254.0" height="19" fill="#0d1117"/><g class="s4c1k"><rect class="blink" x="36.260000000000005" y="210" width="8.1" height="16" fill="#c9d1d9"/></g></g><text class="s4c1l0" x="20" y="242" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="700">Device integrity doctor</tspan></text><text class="s4c1l1" x="20" y="261" xml:space="preserve">  <tspan fill="#d29922">!</tspan>  Bootloader unlocked</text><text class="s4c1l2" x="20" y="280" xml:space="preserve">  <tspan fill="#d29922">!</tspan>  Developer options enabled</text><text class="s4c1l3" x="20" y="299" xml:space="preserve">  <tspan fill="#8b949e">·  Build signed with release-keys</tspan></text><text class="s4c1l4" x="20" y="318" xml:space="preserve">  <tspan fill="#8b949e">·  microG present (no real Play Integrity verdict)</tspan></text></g>
  </g>
